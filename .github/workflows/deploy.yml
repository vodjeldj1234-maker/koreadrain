name: Deploy koreadrain.kr

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 49째방: 정보글 예약 발행 — 매일 한국 00:30 (UTC 15:30) 다시 빌드. 「날짜」가 된 글이 이때 공개된다
  schedule:
    - cron: '30 15 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: build site
        run: python build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
